[package]
name = "horse_heroes"
version = "0.2.5"
edition = "2024"
description = "An idle RPG about a party of horses, their expeditions and their gear"
license = "GPL-3.0-or-later"

[dependencies]
bevy = "=0.20.0"
ron = "0.12"
serde = { version = "1", features = ["derive"] }

# Fast iteration: light optimisation for our code, full for dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
